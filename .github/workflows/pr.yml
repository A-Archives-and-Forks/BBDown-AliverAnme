name: Pull Request Checks

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: "10.0.300"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true

      - name: Restore
        run: dotnet restore BBDown.sln

      - name: Build (Release, includes AOT-compat compile via Directory.Build.props)
        run: dotnet build BBDown.sln -c Release --no-restore

      - name: Test (unit)
        # 排除全部集成类别：外部网络（NetworkIntegration）与本地 ffmpeg（LocalIntegration）
        run: dotnet test BBDown.sln -c Release --no-build --filter "Category!=Integration&Category!=NetworkIntegration&Category!=LocalIntegration"

  vulnerability-scan:
    name: NuGet Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true

      - name: Restore
        run: dotnet restore BBDown.sln

      - name: Audit packages
        # --include-transitive：仅扫描直接依赖会漏掉传递依赖中的已知漏洞，
        # NuGet 官方要求显式包含传递依赖
        run: dotnet list BBDown.sln package --vulnerable --include-transitive

  # 格式门禁（硬性）：此前的存量 CRLF/BOM 问题已随格式修复 PR 清理，
  # 报告确认 dotnet format --verify-no-changes 当前通过，升级为硬性门禁防回归。
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true

      - name: Restore
        run: dotnet restore BBDown.sln

      - name: Verify formatting
        run: dotnet format BBDown.sln --verify-no-changes --no-restore

  # 本地可重复的集成测试（无需外部网络）：真实 ffmpeg 混流冒烟。本机 ffmpeg
  # 不可用时测试内部直接跳过（不产生失败），因此该 job 可以作为硬性门禁阻断 PR。
  local-integration:
    name: Integration Tests (local ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Restore
        run: dotnet restore BBDown.sln

      - name: Test (local integration)
        # 独立 runner 无其他 job 的构建产物，必须显式构建（dotnet test 自带 build）
        run: dotnet test BBDown.sln -c Release --filter "Category=LocalIntegration"

  # 外部网络集成测试：真实访问 B 站 API，验证解析/重定向/登录检测等端到端路径。
  # 不阻断 PR（网络抖动/API 变更易误报），但必须运行并报告结果；失败时收集
  # 测试输出供人工判断是"网络环境失败"还是"代码回归"。
  network-integration:
    name: Integration Tests (external network)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true

      - name: Restore
        run: dotnet restore BBDown.sln

      - name: Test (network integration)
        # 独立 runner 无其他 job 的构建产物，必须显式构建（dotnet test 自带 build）。
        # --logger trx 产出 TRX 测试结果供失败分析：此前无 logger 时通常没有 .trx 可上传，
        # 失败时只能靠 console 输出人工判断，网络 job 的"报告结果"形同虚设。
        run: dotnet test BBDown.sln -c Release --filter "Category=NetworkIntegration" --logger "trx;LogFileName=network.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            BBDown.Tests/TestResults/*.trx
            BBDown.Tests/TestResults/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Native AOT smoke：BBDown 的 Directory.Build.props 全局 PublishAot=true，
  # 确保 PR 能产出可运行的 AOT 二进制（与 release.yml 的 linux-x64 对齐）
  aot-smoke:
    name: Native AOT smoke (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true

      - name: Restore
        run: dotnet restore BBDown/BBDown.csproj -r linux-x64

      - name: Publish Native AOT (linux-x64)
        run: dotnet publish BBDown/BBDown.csproj -c Release -r linux-x64 --no-restore

      - name: Verify binary
        run: |
          test -x BBDown/bin/Release/net10.0/linux-x64/publish/BBDown
          BBDown/bin/Release/net10.0/linux-x64/publish/BBDown --version
